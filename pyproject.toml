[project]
name = "multi"
version = "0.1.1"
description = "📚 Manage all my other projects 📚"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = [
    "abbrev",
    "typer",
    "dtyper",
    "loady",
    "tomlkit",
    "datacls",
    "lxml",
    "safer",
    "requests",
    "refurb",
    "pelican[markdown]",
    "typogrify",
    "ruamel.yaml",
    "pyupgrade>=3.21.2",
]

[project.scripts]
multi = "multi.__main__:main"

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material",
    "coverage>=7.13.2",
    "pyupgrade>=3.21.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[tool.uv]
package = true

[tool.coverage]

[tool.ruff.format]
quote-style = "single"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
